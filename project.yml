name: DrawPad
options:
  bundleIdPrefix: com.example.drawpad
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DrawPadMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.drawpad.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DrawPad
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_LSMultipleInstancesProhibited: YES
        CODE_SIGN_ENTITLEMENTS: macOS/DrawPadMac.entitlements
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: macOS/DrawPadMac.entitlements
  DrawPadiPad:
    type: application
    platform: iOS
    sources:
      - Shared
      - iPadOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.drawpad.ipad
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iPadOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 2
  DrawPadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Shared
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.drawpad.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DrawPadMac:
    build:
      targets:
        DrawPadMac: all
  DrawPadiPad:
    build:
      targets:
        DrawPadiPad: all
  DrawPadTests:
    build:
      targets:
        DrawPadTests: [test]
    test:
      targets:
        - DrawPadTests
