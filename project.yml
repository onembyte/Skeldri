name: Skeldri
options:
  bundleIdPrefix: com.onembyte.skeldri
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Every App Store Connect upload needs a higher CURRENT_PROJECT_VERSION;
    # scripts/release.sh passes it explicitly. Info.plists read both values.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The paid Apple Developer Program team (Individual). A Team ID is public
    # (it appears in every signature); it is not a credential.
    DEVELOPMENT_TEAM: M3A5V2ZKZ4
targets:
  SkeldriMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
    settings:
      base:
        # Mac and iPad share one identifier: one App Store record, one universal purchase.
        PRODUCT_BUNDLE_IDENTIFIER: com.onembyte.skeldri
        # Finder, Spotlight, and the privacy panes show the bundle name.
        PRODUCT_NAME: Skeldri
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/SkeldriMac.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: macOS/SkeldriMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
  SkeldriPad:
    type: application
    platform: iOS
    sources:
      - Shared
      - iPadOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onembyte.skeldri
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iPadOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 2
  SkeldriTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Shared
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onembyte.skeldri.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SkeldriMac:
    build:
      targets:
        SkeldriMac: all
  SkeldriPad:
    build:
      targets:
        SkeldriPad: all
  SkeldriTests:
    build:
      targets:
        SkeldriTests: [test]
    test:
      targets:
        - SkeldriTests
