name: Skeldri
options:
  # Preserve the pre-rename identifiers so installed apps and macOS privacy
  # grants upgrade in place. Migrate them only as a separately planned release.
  bundleIdPrefix: com.example.drawpad
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SkeldriMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.drawpad.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Skeldri
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSMultipleInstancesProhibited: YES
        CODE_SIGN_ENTITLEMENTS: macOS/SkeldriMac.entitlements
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: macOS/SkeldriMac.entitlements
  SkeldriPad:
    type: application
    platform: iOS
    sources:
      - Shared
      - iPadOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.drawpad.ipad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iPadOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 2
  SkeldriTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Shared
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.drawpad.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SkeldriMac:
    build:
      targets:
        SkeldriMac: all
  SkeldriPad:
    build:
      targets:
        SkeldriPad: all
  SkeldriTests:
    build:
      targets:
        SkeldriTests: [test]
    test:
      targets:
        - SkeldriTests
